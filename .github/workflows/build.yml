# Builds for Linux (AppImage), Windows (zip) and macOS (zipped .app).
# Started by hand (Actions -> build -> Run workflow) or by pushing a `v*`
# tag. The packages are uploaded as workflow artifacts; a tag also
# publishes them as a GitHub release, which the update check reads.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The AppImage needs the runner's glibc (2.39) or newer. 22.04 is too old:
    # the `pipewire` crate 0.10 needs newer headers than its PipeWire 0.3.48.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about (third-party licences, packaging/licenses.sh)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config desktop-file-utils
      - run: cargo test --workspace
      - run: cargo build --release -p volcasm-app
      - name: Build AppImage
        run: |
          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  appimagetool" | sha256sum -c
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=./appimagetool packaging/appimage.sh
          cp docs/guide.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: volcasm-linux-x86_64
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      # Test fixtures are compared byte for byte: no line ending conversion.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about (third-party licences, packaging/licenses.sh)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.4
      - run: cargo test --workspace
      - run: cargo build --release -p volcasm-app
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          dir=dist/volcasm-$version-windows-x64
          mkdir -p "$dir"
          cp target/release/volcasm.exe "$dir/"
          cp docs/guide.md "$dir/README.md"
          packaging/licenses.sh "$dir/licenses"
          # The zip is what a release ships and what the updater unpacks.
          (cd dist && 7z a -tzip "volcasm-$version-windows-x64.zip" "volcasm-$version-windows-x64")
          rm -r "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: volcasm-windows-x64
          path: dist/

  macos:
    # Apple Silicon runner; the x86_64 binary is cross-compiled and both are
    # joined into one universal Volcasm.app. Tests run on arm64 only.
    # GitHub's macOS arm64 runners are sometimes not available ("not
    # acquired by Runner"), so a release does not wait for this job: re-run
    # it later and it adds its package to the existing release.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install cargo-about (third-party licences, packaging/licenses.sh)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.4
      - run: cargo test --workspace
      - run: cargo build --release -p volcasm-app --target aarch64-apple-darwin
      - run: cargo build --release -p volcasm-app --target x86_64-apple-darwin
      - name: Build app bundle
        run: |
          sh packaging/macos.sh
          cp docs/guide.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: volcasm-macos-universal
          path: dist/
      - name: Add to the release if it was published without macOS
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no release yet; the release job includes this package"
            exit 0
          fi
          cd dist
          zip=$(ls *.zip)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D .
          { grep -v " $zip\$" SHA256SUMS || true; shasum -a 256 "$zip"; } > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$zip" SHA256SUMS

  release:
    # A tag `vX.Y.Z` publishes the packages and their SHA-256 sums. A tag
    # with a suffix (`v0.2.0-rc1`) makes a pre-release, which the update
    # check does not see. Runs once Linux and Windows are built, whether or
    # not a macOS runner was available (the macOS job can add its package
    # later).
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          flags=""
          case "$tag" in
            *-*) flags="--prerelease" ;;
            "v$version") ;;
            *) echo "tag $tag does not match version $version in Cargo.toml"; exit 1 ;;
          esac
          # Release notes: the CHANGELOG.md section of this version, else
          # notes generated from the merged pull requests.
          awk -v v="${tag#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes="--notes-file ../notes.md"; else notes="--generate-notes"; fi
          cd artifacts
          files=$(ls *.AppImage *.zip)
          sha256sum $files > SHA256SUMS
          cat SHA256SUMS
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "volcasm ${tag#v}" \
            $notes $flags $files SHA256SUMS

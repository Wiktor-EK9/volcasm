[workspace]
resolver = "3"
members = [
    "volcasm-syro-sys",
    "volcasm-core",
    "volcasm-audio",
    "volcasm-vosyr-import",
    "volcasm-app",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
# Not published to crates.io; also keeps the crates out of cargo-about.
publish = false

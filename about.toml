# cargo-about: licences of the crates compiled into Volcasm, shipped with
# every build as THIRD-PARTY-LICENSES.html (packaging/licenses.sh).
# All accepted licences are compatible with the GPL-3.0-or-later.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Volcasm's own crates (GPL-3.0-or-later, LICENSE) are not listed.
private = { ignore = true }
# Crates whose licence files need special handling.
workarounds = ["ring", "rustls"]

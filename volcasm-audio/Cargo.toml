[package]
name = "volcasm-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18.2"
# Resampling of the stream for outputs not at 44.1 kHz (Windows, D23).
volcasm-core = { path = "../volcasm-core" }

# PipeWire: the transfer checks its graph (D18). Other systems use cpal's
# default host (WASAPI on Windows, D23).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }
pipewire = "0.10"

[dev-dependencies]
hound = "3.5.1"

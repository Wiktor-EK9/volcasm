[package]
name = "volcasm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hound = "3.5.1"
rubato = "5.0.1"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "pcm", "mp3", "ogg", "vorbis", "flac"] }
volcasm-syro-sys = { path = "../volcasm-syro-sys" }

[dev-dependencies]
volcasm-syro-sys = { path = "../volcasm-syro-sys", features = ["reference-example"] }

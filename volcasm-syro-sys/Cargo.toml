[package]
name = "volcasm-syro-sys"
description = "FFI bindings to KORG SYRO for volca sample (vendored SDK)"
version.workspace = true
edition.workspace = true
# Vendored KORG SYRO SDK is BSD-3-Clause, see vendor/volcasample/COPYING.
license = "GPL-3.0-or-later AND BSD-3-Clause"
links = "syro_volcasample"

[features]
# Builds the unmodified SDK example as a reference binary for tests.
reference-example = []

[build-dependencies]
bindgen = "0.73.2"
cc = "1.8.0"
